<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="preload" href="/images/landscape_home.png" as="image">
    <title>Block Puzzle - Statistics</title>
    <link rel="stylesheet" href="/css/style_home.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .stats-card {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border: 2px solid #2ecc71;
            text-align: left;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.2);
        }
        .feedback-input-section {
            background: rgba(44, 62, 80, 0.8);
            padding: 20px;
            margin-top: 20px;
            border: 2px solid #f1c40f;
            text-align: center;
        }
        .pixel-input {
            background: #222;
            border: 2px solid #2ecc71;
            color: white;
            padding: 10px;
            font-family: monospace;
            width: 80%;
            margin-bottom: 10px;
        }
        .rating-select {
            background: #222;
            border: 2px solid #f1c40f;
            color: #f1c40f;
            padding: 5px 10px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .submit-btn {
            background-color: #2ecc71;
            color: black;
            border: none;
            padding: 10px 25px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .submit-btn:hover { background-color: #27ae60; }

        .back-link {
            display: inline-block;
            margin: 30px 0;
            color: #2ecc71;
            text-decoration: none;
            font-family: monospace;
            font-weight: bold;
            font-size: 1.2em;
        }
        .star-rating { color: #f1c40f; font-size: 1.5em; }
    </style>
</head>
<body class="home-page">

<div class="content-wrapper">
    <h1 class="pixel-title" style="font-size: 60px;">HALL OF FAME</h1>

    <div class="star-rating">
        Average Rating: <span th:text="${avgRating}">0</span> ★
    </div>

    <div th:if="${@userController.logged}" class="feedback-input-section">
        <h3 style="color: #f1c40f; margin-top: 0;">LEAVE YOUR FEEDBACK</h3>
        <form action="/block-puzzle/feedback" method="post">
            <input type="text" name="commentText" class="pixel-input" placeholder="Write your comment here..." required>
            <br>
            <label style="color: white;">Your Rating: </label>
            <select name="rating" class="rating-select">
                <option value="0"> </option>
                <option value="5">5 ★★★★★ (Excellent)</option>
                <option value="4">4 ★★★★☆ (Good)</option>
                <option value="3">3 ★★★☆☆ (Normal)</option>
                <option value="2">2 ★★☆☆☆ (Bad)</option>
                <option value="1">1 ★☆☆☆☆ (Terrible)</option>
            </select>
            <br>
            <button type="submit" class="submit-btn">SUBMIT TO THE MINE</button>
        </form>
    </div>

    <div class="stats-grid">
        <div class="stats-card">
            <h3 style="color: #2ecc71; text-align: center; text-transform: uppercase;">Top Miners</h3>
            <table style="width: 100%; border-collapse: collapse; color: white; font-family: monospace; font-size: 1.1em;">
                <tr th:each="s : ${scores}" style="border-bottom: 1px solid #333;">
                    <td th:text="${s.player}" style="padding: 8px;"></td>
                    <td th:text="${s.points}" style="text-align: right; color: #f1c40f; font-weight: bold;"></td>
                </tr>
            </table>
        </div>

        <div class="stats-card">
            <h3 style="color: #3498db; text-align: center; text-transform: uppercase;">Comments</h3>
            <div style="max-height: 400px; overflow-y: auto; padding-right: 10px;">
                <div th:each="c : ${comments}" style="border-bottom: 1px solid #444; padding: 10px 0;">
                    <strong th:text="${c.player}" style="color: #3498db;"></strong>
                    <p th:text="${c.comment}" style="margin: 5px 0 0 0; font-size: 0.95em; line-height: 1.4;"></p>
                </div>
            </div>
        </div>
    </div>

    <div style="display: flex; gap: 30px; justify-content: center;">
        <a href="/block-puzzle-home" class="back-link">← BACK TO MINING HUB</a>

        <a th:if="${@userController.logged and @blockPuzzleController.gameInProgress}"
           href="/block-puzzle"
           class="back-link"
           style="color: #3498db;">
            CONTINUE CURRENT MINE →
        </a>

        <a th:if="${@userController.logged and !@blockPuzzleController.gameInProgress}"
           href="/block-puzzle?command=new"
           class="back-link"
           style="color: #2ecc71;">
            START NEW MINE →
        </a>

        <a th:if="${!@userController.logged}"
           href="/block-puzzle-home"
           class="back-link"
           style="color: #f1c40f;">
            SIGN UP TO PLAY →
        </a>
    </div>
</div>

</body>
</html>
